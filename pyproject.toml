[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "persistbench"
version = "0.1.0"
description = "PersistBench: cross-session propagation of silent agent failures through long-term memory (Week 1 harness)"
requires-python = ">=3.11"

[tool.setuptools]
packages = ["persistbench"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
